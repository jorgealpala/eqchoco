<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNGRD · Portal de Situación — Sismo San José del Palmar (Chocó)</title>
<style>
  :root{--navy:#143A6B;--navy-2:#1B4A87;--yellow:#F7C600;--muted:#5c6a80;--line:#d7dde6;--bg:#eef1f5}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:#16233b;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column}
  header.top{background:#fff;border-bottom:4px solid var(--navy);flex:none}
  .top-inner{max-width:1280px;margin:0 auto;padding:12px 18px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .top-inner img.logo{height:50px}
  .ti{flex:1 1 340px;min-width:240px;border-left:3px solid var(--yellow);padding-left:16px}
  .ti .ev{font-size:11.5px;letter-spacing:.16em;color:var(--muted);font-weight:800;text-transform:uppercase}
  .ti h1{font-size:20px;color:var(--navy);font-weight:800;line-height:1.12;margin:2px 0 0}
  .ti .sub{font-size:12px;color:var(--muted);margin-top:2px}
  .rep{text-align:right;font-size:11.5px;color:var(--muted)}
  .rep .badge{display:inline-block;background:var(--navy);color:#fff;font-weight:800;padding:4px 9px;border-radius:6px;font-size:11.5px}
  .flag{height:5px;display:flex;flex:none}.flag i{flex:1}.flag i:nth-child(1){background:var(--yellow);flex:2}.flag i:nth-child(2){background:#00399B}.flag i:nth-child(3){background:#CE1126}
  nav.tabs{background:var(--navy);flex:none;display:flex;gap:2px;padding:0 12px;max-width:100%;overflow:auto}
  nav.tabs button{border:none;background:transparent;color:#c3cede;font-weight:700;font-size:14px;padding:13px 22px;cursor:pointer;border-bottom:3px solid transparent;transition:.15s}
  nav.tabs button:hover{color:#fff}
  nav.tabs button.on{color:#fff;border-bottom-color:var(--yellow);background:rgba(255,255,255,.06)}
  .frames{flex:1;position:relative;min-height:0}
  .frames iframe{width:100%;height:100%;border:0;display:block}
  .frames iframe.hide{display:none}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;pointer-events:none}
</style>
</head>

    Object.entries(frames).forEach(([k,fr])=>{
      if(k===t && !fr.src && fr.dataset.src){ fr.src=fr.dataset.src; }  // carga diferida
      fr.classList.toggle("hide",k!==t);
    });
    const fr=frames[t];
    setTimeout(()=>{try{fr.contentWindow.dispatchEvent(new Event("resize"));}catch(e){}},120);
  }
  tabs.forEach(b=>b.onclick=()=>show(b.dataset.t));
</script>
</body>
</html>
